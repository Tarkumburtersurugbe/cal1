<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="calculator-shell">
      <div class="calculator">
        <div class="calculator-header">
          <div class="brand">
            <span class="brand-dot"></span>
            Calculator
          </div>
          <button class="ghost-button" id="clearButton" data-action="clear" type="button">AC</button>
        </div>

        <div id="display" class="display" aria-live="polite" aria-label="Calculator display"></div>

        <div class="buttons" aria-label="Calculator buttons">
          <button class="btn secondary" type="button" data-action="clear">C</button>
          <button class="btn secondary" type="button" data-action="delete">DEL</button>
          <button class="btn secondary" type="button" data-action="percent">%</button>
          <button class="btn operator" type="button" data-value="/">÷</button>

          <button class="btn" type="button" data-value="7">7</button>
          <button class="btn" type="button" data-value="8">8</button>
          <button class="btn" type="button" data-value="9">9</button>
          <button class="btn operator" type="button" data-value="*">×</button>

          <button class="btn" type="button" data-value="4">4</button>
          <button class="btn" type="button" data-value="5">5</button>
          <button class="btn" type="button" data-value="6">6</button>
          <button class="btn operator" type="button" data-value="-">−</button>

          <button class="btn" type="button" data-value="1">1</button>
          <button class="btn" type="button" data-value="2">2</button>
          <button class="btn" type="button" data-value="3">3</button>
          <button class="btn operator" type="button" data-value="+">+</button>

          <button class="btn zero" type="button" data-value="0">0</button>
          <button class="btn" type="button" data-value=".">.</button>
          <button class="btn equals" type="button" data-action="calculate">=</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
